spring.application.name=Online Quiz Application

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/online_quiz_db
spring.data.mongodb.database=online_quiz_db

# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/**

# Logging
logging.level.root=INFO
logging.level.com.quiz=DEBUG

# Application Info
app.name=Online Quiz Application
app.version=1.0.0
app.description=Full-stack web application for online quiz assessment
