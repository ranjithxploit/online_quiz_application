<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Admin Dashboard - Quiz App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #1e3a8a;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .admin-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            letter-spacing: 0.5px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: white;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 16px;
            color: #718096;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            color: #2d3748;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #1e3a8a;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 58, 138, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: #fed7d7;
            border: 2px solid #fc8181;
            color: #c53030;
        }

        .alert-success {
            background: #c6f6d5;
            border: 2px solid #68d391;
            color: #2f855a;
        }

        .alert-info {
            background: #bee3f8;
            border: 2px solid #63b3ed;
            color: #2c5282;
        }

        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .quiz-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .quiz-item:hover {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .quiz-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 4px;
        }

        .quiz-info p {
            font-size: 13px;
            color: #718096;
        }

        .quiz-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-view {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-view:hover {
            background: #cbd5e0;
        }

        .btn-delete {
            background: #fed7d7;
            color: #c53030;
        }

        .btn-delete:hover {
            background: #fc8181;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #a0aec0;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
        }

        .modal-close {
            background: #f7fafc;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            color: #4a5568;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #edf2f7;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(85vh - 140px);
        }

        .quiz-detail-meta {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #4a5568;
        }

        .detail-icon {
            width: 20px;
            height: 20px;
            background: #f7fafc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .question-number {
            font-size: 12px;
            font-weight: 600;
            color: #667eea;
            background: #ebf4ff;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .question-points {
            font-size: 12px;
            color: #718096;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            padding: 10px 14px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item.correct {
            background: #c6f6d5;
            border-color: #68d391;
            color: #2f855a;
        }

        .option-letter {
            width: 24px;
            height: 24px;
            background: #e2e8f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
        }

        .option-item.correct .option-letter {
            background: #48bb78;
            color: white;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .navbar-content {
                flex-direction: column;
                gap: 12px;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <div class="logo-icon">Q</div>
                <div class="logo-text">Quiz App</div>
                <span class="admin-badge">ADMIN</span>
            </div>
            <div class="user-section">
                <span class="user-name" id="userName">Loading...</span>
                <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <p>Generate and manage quizzes using AI</p>
        </div>

        <div class="main-grid">
            <!-- Quiz Generation Form -->
            <div class="card">
                <h2 class="card-title">Generate New Quiz with AI</h2>
                
                <div class="alert alert-info" id="infoAlert"></div>
                <div class="alert alert-error" id="errorAlert"></div>
                <div class="alert alert-success" id="successAlert"></div>

                <form onsubmit="handleGenerateQuiz(event)">
                    <div class="form-group">
                        <label class="form-label">Quiz Title</label>
                        <input type="text" class="form-input" id="quizTitle" placeholder="e.g., Java Programming Basics" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-textarea" id="quizDescription" placeholder="Brief description of the quiz..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Topic (for AI Generation)</label>
                        <input type="text" class="form-input" id="quizTopic" placeholder="e.g., Java OOP concepts, variables, loops" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <input type="text" class="form-input" id="quizCategory" placeholder="e.g., Programming, Science, Math" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Number of Questions</label>
                            <input type="number" class="form-input" id="numberOfQuestions" min="1" max="20" value="5" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select" id="difficulty" required>
                                <option value="EASY">Easy</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="HARD">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Time Limit (minutes)</label>
                        <input type="number" class="form-input" id="timeLimit" min="5" max="180" value="30" required>
                    </div>

                    <button type="submit" class="submit-btn" id="generateBtn">
                        🤖 Generate Quiz with AI
                    </button>
                </form>
            </div>

            <!-- Quiz List -->
            <div class="card">
                <h2 class="card-title">Existing Quizzes</h2>
                <div id="quizListContainer">
                    <div class="loading">Loading quizzes...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz View Modal -->
    <div class="modal-overlay" id="quizModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalQuizTitle">Quiz Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Quiz details will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Check authentication
        function checkAuth() {
            const userData = localStorage.getItem('currentUser');
            if (!userData) {
                window.location.href = '/adminlogin.html';
                return;
            }
            currentUser = JSON.parse(userData);
            
            // Check if user is admin
            if (currentUser.role !== 'ADMIN') {
                alert('Access denied. Admin privileges required.');
                window.location.href = '/login';
                return;
            }
            
            document.getElementById('userName').textContent = currentUser.fullName;
        }

        function showAlert(type, message) {
            const alertId = type + 'Alert';
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.classList.add('show');
            
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        async function handleGenerateQuiz(event) {
            event.preventDefault();

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '🔄 Generating Quiz...';

            const formData = {
                userId: currentUser.id,
                title: document.getElementById('quizTitle').value,
                description: document.getElementById('quizDescription').value,
                topic: document.getElementById('quizTopic').value,
                category: document.getElementById('quizCategory').value,
                numberOfQuestions: parseInt(document.getElementById('numberOfQuestions').value),
                difficulty: document.getElementById('difficulty').value,
                timeLimit: parseInt(document.getElementById('timeLimit').value)
            };

            try {
                showAlert('info', 'Generating quiz using Gemini AI... This may take a moment.');

                const response = await fetch('/api/admin/generate-quiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', 'Quiz generated successfully! 🎉');
                    // Reset form
                    event.target.reset();
                    // Reload quiz list
                    loadQuizzes();
                } else {
                    showAlert('error', data.message || 'Failed to generate quiz');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'An error occurred while generating the quiz');
            } finally {
                btn.disabled = false;
                btn.textContent = '🤖 Generate Quiz with AI';
            }
        }

        async function loadQuizzes() {
            const container = document.getElementById('quizListContainer');
            
            try {
                const response = await fetch(`/api/admin/quizzes?userId=${currentUser.id}`);
                const data = await response.json();

                if (data.success && data.quizzes.length > 0) {
                    container.innerHTML = `
                        <div class="quiz-list">
                            ${data.quizzes.map(quiz => createQuizItem(quiz)).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>No quizzes yet. Generate your first quiz!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading quizzes:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Error loading quizzes</p>
                    </div>
                `;
            }
        }

        function createQuizItem(quiz) {
            const questionCount = quiz.questions ? quiz.questions.length : 0;
            return `
                <div class="quiz-item">
                    <div class="quiz-info">
                        <h3>${quiz.title || 'Untitled Quiz'}</h3>
                        <p>${questionCount} questions • ${quiz.timeLimit || 30} min • ${quiz.totalPoints || 0} points</p>
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-small btn-view" onclick="viewQuiz('${quiz.id}')">View</button>
                        <button class="btn-small btn-delete" onclick="deleteQuiz('${quiz.id}')">Delete</button>
                    </div>
                </div>
            `;
        }

        function viewQuiz(quizId) {
            // Fetch and display quiz details in modal
            fetchQuizDetails(quizId);
        }

        async function fetchQuizDetails(quizId) {
            try {
                const response = await fetch(`/api/quizzes/${quizId}`);
                const quiz = await response.json();

                if (!quiz) {
                    showAlert('error', 'Quiz not found');
                    return;
                }

                displayQuizModal(quiz);
            } catch (error) {
                console.error('Error fetching quiz:', error);
                showAlert('error', 'Failed to load quiz details');
            }
        }

        function displayQuizModal(quiz) {
            const modal = document.getElementById('quizModal');
            const modalTitle = document.getElementById('modalQuizTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = quiz.title || 'Quiz Details';

            const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
            
            const questionsHTML = quiz.questions && quiz.questions.length > 0 
                ? quiz.questions.map((q, index) => {
                    const optionsHTML = q.options.map((opt, i) => `
                        <div class="option-item ${opt.correct ? 'correct' : ''}">
                            <span class="option-letter">${letters[i]}</span>
                            <span>${opt.optionText}</span>
                            ${opt.correct ? '<span style="margin-left: auto; font-size: 12px;">✓ Correct</span>' : ''}
                        </div>
                    `).join('');

                    return `
                        <div class="question-item">
                            <div class="question-header">
                                <span class="question-number">Question ${index + 1}</span>
                                <span class="question-points">${q.points || 1} point${(q.points || 1) > 1 ? 's' : ''}</span>
                            </div>
                            <div class="question-text">${q.questionText}</div>
                            <div class="options-list">
                                ${optionsHTML}
                            </div>
                        </div>
                    `;
                }).join('')
                : '<p style="text-align: center; color: #718096;">No questions in this quiz</p>';

            modalBody.innerHTML = `
                <div class="quiz-detail-meta">
                    <div class="detail-item">
                        <span class="detail-icon">📚</span>
                        <span><strong>Category:</strong> ${quiz.category || 'General'}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">❓</span>
                        <span><strong>Questions:</strong> ${quiz.questions ? quiz.questions.length : 0}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">⏱️</span>
                        <span><strong>Time Limit:</strong> ${quiz.timeLimit || 30} minutes</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon">⭐</span>
                        <span><strong>Total Points:</strong> ${quiz.totalPoints || 0}</span>
                    </div>
                </div>
                <p style="color: #718096; margin-bottom: 20px;">${quiz.description || ''}</p>
                <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1a202c;">Questions</h3>
                ${questionsHTML}
            `;

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('quizModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // Close modal on overlay click
        document.getElementById('quizModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        async function deleteQuiz(quizId) {
            if (!confirm('Are you sure you want to delete this quiz?')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/quiz/${quizId}?userId=${currentUser.id}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('success', 'Quiz deleted successfully');
                    loadQuizzes();
                } else {
                    showAlert('error', data.message || 'Failed to delete quiz');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'An error occurred while deleting the quiz');
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/adminlogin.html';
        }

        // Initialize
        checkAuth();
        loadQuizzes();
    </script>
</body>
</html>
